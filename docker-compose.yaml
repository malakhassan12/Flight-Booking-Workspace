services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      # POSTGRES_DB: user_db

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - backend

  #########################################################

  user-service:
    build:
      context: .
      dockerfile: apps/user-service/Dockerfile

    container_name: user-service

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - apps/user-service/.env
      - .env

    expose:
      - '3001'

    networks:
      - backend

  #########################################################

  auth-service:
    build:
      context: .
      dockerfile: apps/auth-service/Dockerfile

    container_name: auth-service

    restart: unless-stopped

    depends_on:
      user-service:
        condition: service_started
      consul:
        condition: service_started

    env_file:
      - apps/auth-service/.env
      - .env

    expose:
      - '3002'

    networks:
      - backend

  #########################################################

  broker:
    image: apache/kafka:latest
    container_name: broker

    ports:
      - '9092:9092'

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3

    networks:
      - backend

  #########################################################

  flight-service:
    build:
      context: .
      dockerfile: apps/flight-service/Dockerfile

    container_name: flight-service

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_started

    env_file:
      - apps/flight-service/.env
      - .env

    expose:
      - '3003'

    networks:
      - backend

  #########################################################

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile

    container_name: api-gateway

    restart: unless-stopped

    depends_on:
      - auth-service
      - user-service
      - flight-service
      - broker

    env_file:
      - apps/api-gateway/.env
      - .env

    ports:
      - '3000:3000'

    networks:
      - backend

  #########################################################

  adminer:
    image: adminer

    container_name: adminer

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - '8080:8080'

    networks:
      - backend

  #########################################################

  consul:
    image: hashicorp/consul:latest
    container_name: consul
    restart: always

    volumes:
      - consul_data:/consul/data
      - ./consul/config:/consul/config

    ports:
      - '8500:8500'
      - '8600:8600/udp'
      - '8600:8600/tcp'

    command: >
      agent
      -server
      -bootstrap-expect=1
      -ui
      -client=0.0.0.0
      -data-dir=/consul/data
      -config-dir=/consul/config

    networks:
      - backend

  #########################################################

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - '8200:8200'
    volumes:
      - ./vault-data:/vault/file
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_LOCAL_CONFIG: |
        {
          "storage": {
            "file": {
              "path": "/vault/file"
            }
          },
          "listener": [
            {
              "tcp": {
                "address": "0.0.0.0:8200",
                "tls_disable": true
              }
            }
          ],
          "default_lease_ttl": "168h",
          "max_lease_ttl": "720h",
          "ui": true
        }
    command: server
    restart: unless-stopped
    networks:
      - backend

  #########################################################

  seat-service:
    build:
      context: .
      dockerfile: apps/seat-service/Dockerfile

    container_name: seat-service

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      broker:
        condition: service_started

    env_file:
      - apps/seat-service/.env
      - .env

    expose:
      - '3004'

    networks:
      - backend


  redis:
      image: redis:latest
      container_name: redis
      ports:
          - '6379:6379'
      volumes:
          - redis-data:/data
      environment:
          - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --appendonly yes
      networks:
          - backend
      restart: unless-stopped


volumes:
  postgres_data:
  consul_data:
  consul_config:
  redis-data:



#########################################################

networks:
  backend:
    driver: bridge
